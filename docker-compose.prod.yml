# Lean live / demo stack (CV go-live). Keeps full compose untouched.
# Usage:
#   docker network create pinterest-network   # once
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Included: Nginx/Vue, FastAPI, Celery worker+beat, Postgres, Redis,
#           MongoDB + RabbitMQ (boot-safe C1; not product SSOT).
# Excluded: MySQL, PgAdmin, mongo-express, Mailhog, PLG, ELK, exporters.
# DB/broker ports are NOT published (Docker network only).

services:
  fastapi-app:
    build:
      context: .
      dockerfile: Dockerfile-fastapi
    image: fastapi-image:latest
    container_name: fastapi-container
    restart: unless-stopped
    # API reached via vuejs/nginx :80 — do not publish 8000 on live.
    expose:
      - "8000"
    volumes:
      - ./media:/fastapi/media
      - ./media/notauth:/fastapi/medianotauth
      - ./logs:/logs
    env_file:
      - ./.env
    networks:
      - pinterest-network
    depends_on:
      - redis
      - postgres
      - rabbitmq
      - mongodb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Reuse image built by fastapi-app (avoid parallel BuildKit tag race)
  celery-worker:
    image: fastapi-image:latest
    pull_policy: never
    container_name: celery-worker-container
    restart: unless-stopped
    command: celery -A app.celery.celery_app.celery_instance worker --loglevel=info
    volumes:
      - ./media:/fastapi/media
      - ./media/notauth:/fastapi/medianotauth
      - ./logs:/logs
    env_file:
      - ./.env
    networks:
      - pinterest-network
    depends_on:
      - redis
      - rabbitmq
      - fastapi-app

  celery-beat:
    image: fastapi-image:latest
    pull_policy: never
    container_name: celery-beat-container
    restart: unless-stopped
    command: celery -A app.celery.celery_app.celery_instance beat --loglevel=info
    volumes:
      - ./media:/fastapi/media
      - ./media/notauth:/fastapi/medianotauth
      - ./logs:/logs
    env_file:
      - ./.env
    networks:
      - pinterest-network
    depends_on:
      - redis
      - rabbitmq
      - fastapi-app

  vuejs:
    build:
      context: .
      dockerfile: Dockerfile-vuejs
    image: vuejs-image:latest
    container_name: vuejs-container
    restart: unless-stopped
    # Host :80 is Caddy; proxy domain → this container
    ports:
      - "8080:80"
    networks:
      - pinterest-network
    depends_on:
      - fastapi-app

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASS}"]
    networks:
      - pinterest-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      POSTGRES_USER: ${POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pinterest-network

  mongodb:
    image: mongo:6
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_DB_PASS}
    volumes:
      - mongodb_data:/data/db
    networks:
      - pinterest-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    networks:
      - pinterest-network

  # Local inbox for verification / transactional mail (UI :8025)
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - pinterest-network

networks:
  pinterest-network:
    external: true

volumes:
  pgdata:
  mongodb_data:
